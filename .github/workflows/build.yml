name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet run --project tests/CD-SaveEditor.Tests -c Release

  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(dotnet msbuild src/CD-SaveEditor/CD-SaveEditor.csproj -getProperty:Version)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "building $VERSION"

  windows:
    name: windows installer
    needs: [test, version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/CD-SaveEditor/CD-SaveEditor.csproj
          -c Release -p:Version=${{ needs.version.outputs.version }}
          -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/win-x64

      - name: Build setup.exe
        shell: pwsh
        env:
          CD_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "installer\windows\CD-SaveEditor.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Portable zip
        shell: pwsh
        run: >
          Compress-Archive -Path publish/win-x64/*
          -DestinationPath "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-win-x64-portable.zip"

      - name: Check the installer exists
        shell: pwsh
        run: |
          Get-ChildItem dist
          if (-not (Test-Path "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-win-x64-setup.exe")) {
            throw "setup.exe was not produced"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: linux installers
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/CD-SaveEditor/CD-SaveEditor.csproj
          -c Release -p:Version=${{ needs.version.outputs.version }}
          -r linux-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/linux-x64

      - name: Build .deb
        run: >
          bash installer/linux/build-deb.sh publish/linux-x64
          "${{ needs.version.outputs.version }}" amd64
          "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-linux-x64.deb"

      - name: Build .run
        run: >
          bash installer/linux/build-run.sh publish/linux-x64
          "${{ needs.version.outputs.version }}"
          "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-linux-x64.run"

      - name: Portable tarball
        run: >
          tar -czf "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-linux-x64.tar.gz"
          -C publish/linux-x64 .

      - name: Validate the .deb
        run: |
          set -euo pipefail
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | head -20
          ar t dist/*.deb

      - name: Install with the .run and start it
        run: |
          set -euo pipefail
          export PREFIX="$RUNNER_TEMP/inst" BINDIR="$RUNNER_TEMP/bin"
          export APPDIR="$RUNNER_TEMP/apps" ICONDIR="$RUNNER_TEMP/icons"
          sh dist/*.run
          test -x "$PREFIX/CD-SaveEditor"
          "$PREFIX/CD-SaveEditor" --version
          sh dist/*.run --uninstall
          test ! -d "$PREFIX"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macos ${{ matrix.rid }}
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
          - rid: osx-x64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches ~/Library/Developer/Xcode/DerivedData \
            /Library/Developer/CoreSimulator/Caches 2>/dev/null || true
          df -h /

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/CD-SaveEditor/CD-SaveEditor.csproj
          -c Release -p:Version=${{ needs.version.outputs.version }}
          -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Build .dmg
        run: >
          bash installer/macos/make-dmg.sh publish/${{ matrix.rid }}
          "${{ needs.version.outputs.version }}"
          "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg"

      - name: Check the bundle
        run: |
          set -euo pipefail
          ls -l dist
          hdiutil attach "dist/CD-SaveEditor-${{ needs.version.outputs.version }}-${{ matrix.rid }}.dmg" -nobrowse -mountpoint /tmp/cdse
          test -x "/tmp/cdse/CD-SaveEditor.app/Contents/MacOS/CD-SaveEditor"
          /tmp/cdse/CD-SaveEditor.app/Contents/MacOS/CD-SaveEditor --version
          hdiutil detach /tmp/cdse -force || hdiutil detach /tmp/cdse || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  android:
    name: android apk
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Android SDK platform
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build the APK
        run: |
          set -euo pipefail
          dotnet publish src/CD-SaveEditor.Android/CD-SaveEditor.Android.csproj \
            -c Release -f net10.0-android -p:AndroidPackageFormat=apk \
            -p:Version=${{ needs.version.outputs.version }} -o dist/android
          APK="dist/android/CD-SaveEditor-${{ needs.version.outputs.version }}-android.apk"
          cp dist/android/dev.neofastftl.cdsaveeditor-Signed.apk "$APK"
          rm -f dist/android/dev.neofastftl.cdsaveeditor.apk \
                dist/android/dev.neofastftl.cdsaveeditor-Signed.apk
          ls -lh "$APK"

      - name: Check the APK
        run: |
          set -euo pipefail
          APK="dist/android/CD-SaveEditor-${{ needs.version.outputs.version }}-android.apk"
          TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin"
          "$TOOLS/apkanalyzer" manifest application-id "$APK" | grep -qx dev.neofastftl.cdsaveeditor
          "$TOOLS/apkanalyzer" manifest print "$APK" | grep -q "MainActivity"
          unzip -p "$APK" AndroidManifest.xml > /dev/null
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmonosgen-2.0.so"
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android/*.apk
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
