name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Run tests
        run: dotnet run --project tests/CD-SaveEditor.Tests -c Release

  build:
    name: ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: CD-SaveEditor-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: CD-SaveEditor-linux-x64.tar.gz
          - os: macos-14
            rid: osx-arm64
            archive: CD-SaveEditor-osx-arm64.tar.gz
          - os: macos-14
            rid: osx-x64
            archive: CD-SaveEditor-osx-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: >
          dotnet publish src/CD-SaveEditor/CD-SaveEditor.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.archive }} -C publish/${{ matrix.rid }} .

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath ${{ matrix.archive }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: CD-SaveEditor-${{ matrix.rid }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
          generate_release_notes: true
